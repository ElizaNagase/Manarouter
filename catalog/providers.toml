# Manarouter provider catalogue — SEED DATA, not runtime configuration.
# This file is compiled into `mr-core` with include_str! and read through
# `mr_core::catalog::catalog()`. It is the list of upstream providers this build knows how to talk
# to, and it exists so that `mr provider add <id>` (and the panel's "add provider" screen) can
# create a correctly-configured provider in one step. Nothing here is read on the request path, and
# nothing here is ever written by the panel. The operator-owned file is
# `~/.config/manarouter/config.json`; once a template is instantiated it becomes an ordinary
# `Provider` there and this file is not consulted again.
# Every entry was sourced from `.research/omniroute.md`, `.research/9router.md`,
# `.research/oauth.md`, `.research/omniroute-protocol-layer.md` and
# `.research/commandcode-bridge.md`. Where the research marks an endpoint or a protocol as
# uncertain, the entry is still shipped and says so in `note`.
# Conventions:
#   * `dialect` is the kebab-case serde spelling: open-ai, anthropic, google, codex, copilot,
#     antigravity, command-code-go.
#   * `auth` is AuthKind's internally-tagged serde shape, so it is always an inline table:
#     { type = "bearer" }, { type = "api-key-header", header = "x-api-key" },
#     { type = "query-param", param = "key" } or { type = "oauth", platform = "openai-codex" }.
#     The `platform` id is the one the OAuth registry produces; use the same spelling here and in config.json.
#   * `base_url` is the prefix the dialect appends its route path to. Where a provider deviates
#     from the dialect default, the deviation is named in `route_overrides`, keyed by the
#     kebab-case RouteKind (chat-completions, responses, embeddings, messages, ...) — that is, the
#     route the client called, not the upstream path. The value is the path appended to `base_url`.
#   * A `{...}` placeholder in a `base_url` is a literal the operator replaces before use; the
#     relay substitutes nothing into it.
#   * A header value written as `${name}` is a template the OAuth layer fills from the credential
#     at request time; it is recorded because a missing header is a hard upstream 400.
#   * Unrecognised keys on an entry are preserved verbatim in the entry's `extra` map: that is
#     where OAuth constants, alternate hosts and path quirks live. An unrecognised key is a
#     RECORDED FACT, not a directive: the relay sends what the template's own fields say and
#     nothing else, so a key the relay does not read (`glm_url_suffix`, `upstream_path`,
#     `bridge_default_port`, `user_agent_template`) is documentation of a fact the research
#     recorded, not something the relay acts on.
#   * `api_key_url` and `docs_url` are omitted unless the research recorded one. Inventing a URL
#     would be worse than leaving the panel to say "consult the provider".
# Binding project decision: no provider that authenticates by browser cookie or by scraping a web
# session is listed here, however many connections the migration source has for it. Cookie/web-
# session entries in the research (claude-web, deepseek-web, gemini-web, zai-web, duckduckgo-web,
# lmarena, veoaifree-web) and the excluded no-auth proxies (aihorde, pollinations) are deliberately
# absent. `ProviderTemplate::validate()` enforces this for anything added later.
# `version` is the data-file format version, so a future migration can tell revisions apart.

version = 1

# ---------------------------------------------------------------------------------------------
# OAuth platforms this project implements itself (verified header fingerprints, `.research/oauth.md`)
# ---------------------------------------------------------------------------------------------

[[providers]]
id = "openai-codex"
label = "OpenAI Codex (ChatGPT subscription)"
dialect = "codex"
base_url = "https://chatgpt.com/backend-api/codex"
auth = { type = "oauth", platform = "openai-codex" }
oauth_platform = "openai-codex"
capabilities = ["responses", "tool-calling", "reasoning", "vision"]
key_strategy = "round-robin"
note = "OAuth only. The relay injects chatgpt-account-id from the JWT claim at https://api.openai.com/auth -> chatgpt_account_id; sending a literal value there is a hard failure. originator must be codex_cli_rs for the official endpoint. UNCERTAIN: OpenAI-Beta responses=experimental is only needed by older servers, so it is sent for compatibility. UNCERTAIN: the two api.connectors.* scopes are version-dependent; older clients request only the first four, and a server that rejects an unknown scope would fail the whole request, so drop them if authorization is refused with an invalid_scope error."
docs_url = "https://github.com/openai/codex"
oauth_authorize_url = "https://auth.openai.com/oauth/authorize"
oauth_token_url = "https://auth.openai.com/oauth/token"
oauth_client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
oauth_scopes = "openid profile email offline_access api.connectors.read api.connectors.invoke"
oauth_redirect_port = 1455
oauth_redirect_path = "/auth/callback"
oauth_pkce = "S256"
user_agent_template = "codex_cli_rs/<version> (<OsType> <os version>; <arch>) <terminal-ua>"

[providers.headers]
"originator" = "codex_cli_rs"
"chatgpt-account-id" = "${chatgpt_account_id}"
"OpenAI-Beta" = "responses=experimental"

[[providers]]
id = "github-copilot"
label = "GitHub Copilot"
dialect = "copilot"
base_url = "https://api.githubcopilot.com"
auth = { type = "oauth", platform = "github-copilot" }
oauth_platform = "github-copilot"
capabilities = ["chat", "responses", "messages", "embeddings", "models", "tool-calling", "reasoning", "vision"]
note = "Editor-Version is mandatory: omitting it is a hard 400 (missing Editor-Version header for IDE auth). Copilot-Integration-Id selects the integrator allowlist that decides model availability. The bearer sent upstream is the Copilot token minted from the GitHub token, never the raw GitHub token."
docs_url = "https://github.com/ericc-ch/copilot-api"
oauth_device_code_url = "https://github.com/login/device/code"
oauth_token_url = "https://github.com/login/oauth/access_token"
copilot_token_url = "https://api.github.com/copilot_internal/v2/token"
copilot_integration_id = "vscode-chat"

[providers.headers]
"Editor-Version" = "vscode/${vs_code_version}"
"Copilot-Integration-Id" = "vscode-chat"
"editor-plugin-version" = "copilot-chat/0.26.7"
"user-agent" = "GitHubCopilotChat/0.26.7"
"openai-intent" = "conversation-panel"
"x-github-api-version" = "2025-04-01"
"x-vscode-user-agent-library-version" = "electron-fetch"

[[providers]]
id = "antigravity"
label = "Google Antigravity / Gemini Code Assist"
dialect = "antigravity"
# Inference lives on the *daily* host. The production host answers onboardUser and
# loadCodeAssist, but it refuses a project minted on the daily host: generateContent there
# returns 429 RESOURCE_EXHAUSTED for every account and every model family, which reads as an
# exhausted quota and is not one. Verified 2026-11-07 against five working accounts.
base_url = "https://daily-cloudcode-pa.googleapis.com"
auth = { type = "oauth", platform = "antigravity" }
oauth_platform = "antigravity"
capabilities = ["chat", "models", "tool-calling", "reasoning", "vision"]
note = "OAuth code exchange, refresh and standard Google userinfo identity are implemented. Antigravity IDE (T2) client metadata, PKCE and Cloud Code project onboarding remain reverse-engineered/unverified; the Gemini CLI T1 identity is selectable in code but does not impersonate the IDE. Cloud Code inference is an internal API and is experimental; login supports free-tier onboardUser and bounded operation polling; paid-tier onboarding fails closed unless an explicit project is supplied, so validate account/project eligibility before production use."
oauth_generate_path = "/v1internal:generateContent"
oauth_stream_path = "/v1internal:streamGenerateContent?alt=sse"
oauth_onboard_path = "/v1internal:onboardUser"
oauth_project_required = true

[providers.headers]
"X-Goog-Api-Client" = "google-cloud-sdk vscode_cloudshelleditor/0.1"
"Client-Metadata" = '{"ideType":"ANTIGRAVITY","platform":"WINDOWS","pluginType":"GEMINI"}'
"User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Antigravity/2.1.1 Chrome/138.0.7204.235 Electron/37.3.1 Safari/537.36"

[[providers.quota]]
name = "weekly"
kind = "provider-declared"
seconds = 604800
reset_only = true

[[providers]]
id = "cline"
label = "Cline"
dialect = "open-ai"
base_url = "https://api.cline.bot/api/v1"
auth = { type = "oauth", platform = "cline" }
oauth_platform = "cline"
capabilities = ["chat", "models", "tool-calling", "reasoning"]
key_strategy = "round-robin"
note = "OAuth-only upstream (authModes=[oauth]). This build does not implement the cline OAuth platform, so the entry records the migration target rather than offering a working login."

# ---------------------------------------------------------------------------------------------
# Command Code — its own CLI envelope, not OpenAI (`.research/commandcode-bridge.md`)
# ---------------------------------------------------------------------------------------------

[[providers]]
id = "command-code"
label = "Command Code"
dialect = "command-code-go"
base_url = "https://api.commandcode.ai"
auth = { type = "bearer" }
capabilities = ["chat", "models", "tool-calling", "reasoning"]
note = "The alpha/generate envelope is always SSE, even for a non-streaming client request; the relay translates the CLI event stream back. The relay pins x-command-code-version to the COMMAND_CODE_VERSION constant in crates/mr-dialects/src/commandcode.rs (1.82.1) and overwrites whatever the provider configures, so the value recorded here documents what is actually sent."
docs_url = "https://github.com/dev2k6/command-code-proxy-server"
upstream_path = "/alpha/generate"
bridge_default_port = 3050

[providers.headers]
"x-command-code-version" = "1.82.1"
"x-cli-environment" = "production"
"accept" = "text/event-stream"

